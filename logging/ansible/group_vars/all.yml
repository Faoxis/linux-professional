---
web_ip: 192.168.56.10
log_ip: 192.168.56.15

# Порт rsyslog. Слушаем и TCP, и UDP: nginx умеет слать логи только по UDP,
# а системные логи и аудит отдаём по TCP, там доставка надёжнее.
syslog_port: 514

# Куда лог-сервер складывает принятое
remote_log_dir: /var/log/rsyslog

# Локальный файл на web только для критичных сообщений
critical_log: /var/log/critical.log
