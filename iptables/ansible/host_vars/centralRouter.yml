netplan_routes:
  eth1:
    # Дефолт в интернет через inetRouter
    - to: 0.0.0.0/0
      via: 192.168.255.1
  eth3:
    # Ключевой маршрут для проброса без маскарадинга: ответы хосту
    # уходят обратно тем же путём, через inetRouter2
    - to: 192.168.56.0/24
      via: 192.168.255.5

iptables_rules: rules-centralRouter.v4.j2
