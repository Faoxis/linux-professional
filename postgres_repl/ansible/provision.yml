---
- name: Postgres
  hosts: all
  become: yes
  tasks:
    # vim и telnet - для более удобной работы с хостами.
    # acl нужен ansible: без него задачи с become_user: postgres падают на том,
    # что непривилегированный пользователь не может прочитать временный файл модуля.
    - name: install base tools
      apt:
        name:
          - vim
          - telnet
          - acl
        state: present
        update_cache: true

# Запуск ролей install_postgres и postgres_replication на хостах node1 и node2
- name: install postgres 14 and set up replication
  hosts: node1,node2
  become: yes
  roles:
    - install_postgres
    - postgres_replication

# Запуск роли install_barman на всех хостах
- name: set up backup
  hosts: all
  become: yes
  roles:
    - install_barman
