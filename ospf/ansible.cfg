[defaults]
# Стенд одноразовый, ключи хостов меняются при каждом пересоздании.
# Без этого ручной запуск ansible-playbook (например, для переключения
# на симметричный роутинг) упирается в "Host key verification failed":
# сам vagrant отключает проверку у своего провижинера, а мы запускаем руками.
host_key_checking = false

# Инвентарь генерирует vagrant при поднятии стенда
inventory = .vagrant/provisioners/ansible/inventory/vagrant_ansible_inventory
