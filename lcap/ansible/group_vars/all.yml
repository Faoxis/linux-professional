---
# Порт, в который на тестовых хостах приходит testLAN. Влан вешается на него.
vlan_parent: eth1
vlan_prefix: 24

# Порты, из которых собирается бонд на inetRouter и centralRouter.
bond_ports:
  - eth1
  - eth2

# 802.3ad - это и есть LACP. Методичка предлагает mode=1 (active-backup),
# но он никакого протокола не согласовывает: резерв там держится на том,
# что второй порт просто молчит. Здесь оба конца договариваются по LACP,
# трафик идёт по обоим линкам, а отключение одного из них переживается так же.
bond_mode: 802.3ad
bond_prefix: 30
