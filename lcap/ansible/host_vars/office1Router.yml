interfaces:
  - name: eth1
    address: 192.168.255.10/30
    routes:
      # Сеть бонда - через centralRouter. Дефолт трогать не надо: он висит
      # на eth0 с меньшей метрикой, через него ВМ ходит за пакетами.
      - { to: 192.168.255.0/30, via: 192.168.255.9 }

  # Порт в testLAN. Адреса нет намеренно: он нужен только чтобы посмотреть
  # tcpdump-ом, как по одному сегменту идут кадры обоих вланов.
  - name: eth2
